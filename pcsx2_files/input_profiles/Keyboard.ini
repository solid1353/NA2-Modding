[Pad]
UseProfileHotkeyBindings = true


[Hotkeys]
ZoomIn = Keyboard/Control & Keyboard/Plus
ZoomOut = Keyboard/Control & Keyboard/Minus
ToggleFullscreen = Keyboard/Alt & Keyboard/Return
TogglePause = Keyboard/Space
ToggleFrameLimit = Keyboard/F4
HoldTurbo = Keyboard/Period
ToggleSlowMotion = Keyboard/Shift & Keyboard/Backtab
ShutdownVM = Keyboard/Escape
InputRecToggleMode = Keyboard/Shift & Keyboard/R
GSDumpSingleFrame = Keyboard/Shift & Keyboard/F8
GSDumpMultiFrame = Keyboard/Control & Keyboard/Shift & Keyboard/F8
ToggleSoftwareRendering = Keyboard/F9
CycleAspectRatio = Keyboard/F6
ToggleMipmapMode = Keyboard/Insert
CycleInterlaceMode = Keyboard/F5

Screenshot = Keyboard/Insert
ToggleTurbo = Keyboard/Tab

PreviousSaveStateSlot = Keyboard/Shift & Keyboard/F2
NextSaveStateSlot = Keyboard/F2
SelectNextSlotAndSaveState = Keyboard/F1
LoadStateFromSlot = Keyboard/F3
LoadBackupStateFromSlot = Keyboard/Shift & Keyboard/F3

SaveStateToSlot1 = Keyboard/1
SaveStateToSlot2 = Keyboard/2
SaveStateToSlot3 = Keyboard/3
SaveStateToSlot4 = Keyboard/4
SaveStateToSlot5 = Keyboard/5
SaveStateToSlot6 = Keyboard/6
SaveStateToSlot7 = Keyboard/7
SaveStateToSlot8 = Keyboard/8
SaveStateToSlot9 = Keyboard/9
SaveStateToSlot10 = Keyboard/0


[Pad1]
Type = DualShock2
Up = Keyboard/W
Right = Keyboard/D
Down = Keyboard/S
Left = Keyboard/A
Triangle = Keyboard/I
Circle = Keyboard/L
Cross = Keyboard/K
Square = Keyboard/J
Select = Keyboard/Backspace
Start = Keyboard/Return
L1 = Keyboard/Q
R1 = Keyboard/E


[Pad2]
Type = DualShock2
Up = Keyboard/Up
Left = Keyboard/Left
Down = Keyboard/Down
Right = Keyboard/Right
Triangle = Keyboard/NumpadUp
Square = Keyboard/NumpadLeft
Circle = Keyboard/NumpadRight
Cross = Keyboard/NumpadClear
Select = Keyboard/NumpadDelete
Start = Keyboard/NumpadEnter
